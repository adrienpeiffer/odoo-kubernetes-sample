apiVersion: v1
kind: Secret
metadata:
  name: odoo-unified-secret
  namespace: odoo
type: Opaque
stringData:
  # Odoo main configuration
  odoo.conf: |
    [options]
    admin_passwd = 5nQvYfC8z3qU-3pJbQm2
    addons_path = /usr/lib/python3/dist-packages/odoo/addons,/var/lib/odoo/.local/share/Odoo/addons/16.0,/var/lib/odoo/custom-addons
    db_name = odoo
    proxy_mode = True
    server_environment = fsprod
  
  # DigitalOcean Spaces credentials (consolidated)
  AWS_ACCESS_KEY_ID: xxxx
  AWS_SECRET_ACCESS_KEY: xxx/xxx/xxx/xxx
  AWS_DEFAULT_REGION: nyc3
  AWS_S3_ENDPOINT_URL: https://nyc3.digitaloceanspaces.com
  S3_BUCKET: xxx-xxx-space
  AWS_S3_FORCE_PATH_STYLE: "true"
  AWS_S3_ADDRESSING_STYLE: "path"
  
  # Server environment configuration files (instead of environment variables)
  fsprod_secret.ini: |
    [fs_storage.fsprod]
    protocol=s3
    directory_path=odoo-k8s-space/attachments
    eval_options_from_env=False
    use_as_default_for_attachments=True
    use_filename_obfuscation=True
    json_options={"endpoint_url": "https://nyc3.digitaloceanspaces.com", "key": "xxxx", "secret": "xxx/xxx/xxx/xxx", "use_ssl": "true"}