apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: odoo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odoo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: odoo
    spec:
      affinity:
        podAffinity:
          # here we want to deploy on the same region the the primary instance of postgres
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: cnpg.io/cluster
                    operator: Exists
                  - key: role
                    operator: In
                    values:
                      - primary
              topologyKey: topology.kubernetes.io/region
      initContainers:
        - name: odoo-init
          image: yusuke1998/kubernetes-odoo:17
          imagePullPolicy: Always # Changed from Never for Digital Ocean cluster
          args:
            - /entrypoint-dbbase
          env: &env
            - name: PGUSER
              valueFrom: &pguser
                secretKeyRef:
                  key: username
                  name: postgres-app # Provided by CNPG
            - name: POSTGRES_USER
              valueFrom: *pguser
            - name: PGPASSWORD
              valueFrom: &pgpassword
                secretKeyRef:
                  key: password
                  name: postgres-app # Provided by CNPG
            - name: POSTGRES_PASSWORD
              valueFrom: *pgpassword
          envFrom: &envFrom
            - configMapRef:
                name: odoo-env
      containers:
        - name: odoo
          image: yusuke1998/kubernetes-odoo:17
          imagePullPolicy: Always # Changed from Never for Digital Ocean cluster
          env: *env
          envFrom: *envFrom
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "250m"
              memory: 256Mi
          ports:
            - containerPort: 8069
              name: web
            - containerPort: 8072
              name: websocket
          readinessProbe:
            httpGet:
              path: /web/health
              port: 8069
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: odoo-config-secret
              mountPath: /etc/odoo/odoo.conf
              subPath: odoo.conf
              readOnly: true
      volumes:
        - name: odoo-config-secret
          secret:
            secretName: odoo-config-secret
            items:
              - key: odoo.conf
                path: odoo.conf
